            let year = dObj.getFullYear();
            let month = dObj.getMonth();
            if (year === 2026 && month === 2 && dObj.getDate() >= 27) month = 3;

            const daysToRender = [];
            if (year === 2026 && month === 2) { 
                for(let i=1; i<=26; i++) daysToRender.push(`2026-03-${String(i).padStart(2, '0')}`);
            } else if (year === 2026 && month === 3) { 
                for(let i=27; i<=31; i++) daysToRender.push(`2026-03-${i}`);
                for(let i=1; i<=30; i++) daysToRender.push(`2026-04-${String(i).padStart(2, '0')}`);
            } else {
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                for(let i=1; i<=daysInMonth; i++) daysToRender.push(`${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`);
            }
            
            Object.values(dbW).forEach(bw => {
                if(bw.name){
                    let b = getBase(bw.name);
                    if(!w[b]) w[b] = {t:0, s:new Set(), mRt: 0}; 
                    let mRt = parseFloat(bw.monthRate)||0;
                    if(mRt > w[b].mRt) w[b].mRt = mRt;
                }
            });

            Object.entries(d).forEach(([k,v]) => {
                if(v.name){
                    let b = getBase(v.name);
                    if(!w[b]) w[b] = {t:0, s:new Set(), mRt:0}; 
                    if(daysToRender.includes(v.date) && !v.isPayout){
                        w[b].t += parseFloat(v.rate) || 0;
                        w[b].s.add(v.date);
                    }
                }
            });

            let h = `<div style="display:flex;gap:5px;margin-bottom:10px">
                <button class="btn-main" onclick="printTsList()" style="background:#0f172a;margin:0;flex:1;font-size:10px;padding:10px 5px">🖨️ ПЕЧАТЬ</button>
                <button class="btn-main" onclick="openWorkersMgmt()" style="background:#2563eb;margin:0;flex:1;font-size:10px;padding:10px 5px">👥 СОТРУДНИКИ</button>
                <button class="btn-main" onclick="openMassAdvance()" style="background:#10b981;margin:0;flex:1;font-size:10px;padding:10px 5px">💸 АВАНС ВСЕМ</button>
            </div><div class="dash-grid">`;

            Object.keys(w).sort().forEach(n=>{
                let finalZp = parseFloat((w[n].t + w[n].mRt).toFixed(2));
                h += `<div class="dash-item" style="padding:15px;border:2px solid var(--p);cursor:pointer;" onclick="openWorkerCalendar('${esc(n)}')">
                    <div style="font-size:14px;font-weight:900;color:var(--p);margin-bottom:5px">${esc(n)}</div>
                    <div style="font-size:10px;color:#64748b">Смен (тек. период): <b>${w[n].s.size}</b></div>
                    <div style="font-size:11px;font-weight:900;color:#059669;margin-top:2px">ЗП за период: ${finalZp} ГРН</div>
                </div>`;
            });
            h += '</div>';
            c.innerHTML = Object.keys(w).length ? h : '<div style="text-align:center;padding:20px;color:#64748b;font-weight:900">Сотрудников пока нет</div>';
        };

        window.openWorkerCalendar = function(name, y, m) {
            const getBase = n => n ? n.replace(/\s*\d+$/, '').trim() : '';
            const dObj = new Date();
            let defY = dObj.getFullYear();
            let defM = dObj.getMonth();
            if (defY === 2026 && defM === 2 && dObj.getDate() >= 27) defM = 3;
            
            const year = y !== undefined ? y : defY;
            const month = m !== undefined ? m : defM; 
            const todayStr = getLocalDateStr();
            const monthKey = year + '-' + String(month + 1).padStart(2, '0');
            
            const daysToRender = [];
            if (year === 2026 && month === 2) { 
                for(let i=1; i<=26; i++) daysToRender.push(`2026-03-${String(i).padStart(2, '0')}`);
            } else if (year === 2026 && month === 3) { 
                for(let i=27; i<=31; i++) daysToRender.push(`2026-03-${i}`);
                for(let i=1; i<=30; i++) daysToRender.push(`2026-04-${String(i).padStart(2, '0')}`);
            } else {
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                for(let i=1; i<=daysInMonth; i++) daysToRender.push(`${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`);
            }

            const firstDateStr = daysToRender[0];
            const firstDayObj = new Date(firstDateStr);
            let firstDayOfWeek = firstDayObj.getDay();
            let startDay = firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1; 
            
            const ts = data.Timesheet || {};
            const shifts = {};
            let totalZp = 0;
            let uniqueDays = new Set();
            let earned1to15 = 0;
            let advanceAmt = 0;
            let salaryAmt = 0;
            
            Object.entries(ts).forEach(([k, v]) => {
                if (v.name && getBase(v.name) === name) {
                    if (v.isPayout && v.forMonth === monthKey) {
                        if (v.payoutType === 'Аванс') advanceAmt += parseFloat(v.payoutAmount) || 0;
                        if (v.payoutType === 'Зарплата') salaryAmt += parseFloat(v.payoutAmount) || 0;
                        
                        if (daysToRender.includes(v.date)) {
                            if(!shifts[v.date]) shifts[v.date] = [];
                            shifts[v.date].push({id: k, ...v});
                        }
                    } 
                    else if (!v.isPayout && daysToRender.includes(v.date)) {
                        if(!shifts[v.date]) shifts[v.date] = [];
                        shifts[v.date].push({id: k, ...v});
                        
                        let rt = parseFloat(v.rate) || 0;
                        totalZp += rt;
                        uniqueDays.add(v.date);
                        
                        let dNum = parseInt(v.date.split('-')[2]);
                        if (dNum <= 15) {
                            earned1to15 += rt;
                        }
                    }
                }
            });
            
            let mRt = 0;
            if (data.Workers) {
                Object.values(data.Workers).forEach(wk => { 
                    if(getBase(wk.name) === name) {
                        let r = parseFloat(wk.monthRate) || 0;
                        if(r > mRt) mRt = r;
                    } 
                });
            }
            
            let totalShifts = uniqueDays.size;
            totalZp = parseFloat(totalZp.toFixed(2));
            let calcAdv = Math.round((earned1to15 * 0.8) / 1000) * 1000;
            let remZp = parseFloat((totalZp + mRt - advanceAmt - salaryAmt).toFixed(2));

            const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
            
            let prevM = month - 1, prevY = year;
            if (prevM < 0) { prevM = 11; prevY--; }
            let nextM = month + 1, nextY = year;
            if (nextM > 11) { nextM = 0; nextY++; }
            
            let titleText = `${monthNames[month]} ${year}`;
            if (year === 2026 && month === 3) titleText = `АПРЕЛЬ 2026 (с 27 Марта)`;
            else if (year === 2026 && month === 2) titleText = `МАРТ 2026 (до 26 числа)`;

            let h = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;background:#f8fafc;padding:5px;border-radius:8px;border:1px solid #cbd5e1">
                <button class="btn-main" style="width:auto;margin:0;padding:5px 15px;background:#64748b" onclick="openWorkerCalendar('${esc(name)}', ${prevY}, ${prevM})">◀</button>
                <div style="font-weight:900;color:var(--p);font-size:12px;text-transform:uppercase;text-align:center;line-height:1">${titleText}</div>
                <button class="btn-main" style="width:auto;margin:0;padding:5px 15px;background:#64748b" onclick="openWorkerCalendar('${esc(name)}', ${nextY}, ${nextM})">▶</button>
            </div>`;
            
            h += `<div style="display:grid;grid-template-columns:repeat(7, 1fr);gap:2px;text-align:center;font-size:9px;font-weight:900;color:#64748b;margin-bottom:4px">
                <div>ПН</div><div>ВТ</div><div>СР</div><div>ЧТ</div><div>ПТ</div><div style="color:#dc2626">СБ</div><div style="color:#dc2626">ВС</div>
            </div>`;
            
            h += `<div style="display:grid;grid-template-columns:repeat(7, 1fr);gap:2px;">`;
            
            for (let i = 0; i < startDay; i++) {
                h += `<div style="background:#f1f5f9;border-radius:4px;min-height:50px;border:1px solid transparent"></div>`;
            }
            
            for (let i = 0; i < daysToRender.length; i++) {
                const dateStr = daysToRender[i];
                const dayNum = parseInt(dateStr.split('-')[2]);
                const dayShifts = shifts[dateStr];
                const isToday = dateStr === todayStr;
                const isFuture = dateStr > todayStr;
                
                const col = (startDay + i) % 7;
                const isWeekend = (col === 5 || col === 6);
                
                let cellBg = isToday ? '#e0e7ff' : '#fff';
                let cellBorder = isToday ? '2px solid var(--p)' : (isWeekend ? '1px solid #fca5a5' : '1px solid #cbd5e1');
                let innerHtml = `<div style="font-weight:900;font-size:12px;color:${isWeekend?'#dc2626':'#0f172a'};text-align:right;padding:2px">${dayNum}</div>`;
                
                if (dayShifts && dayShifts.length > 0) {
                    cellBg = '#ecfdf5';
                    cellBorder = '1px solid #10b981';
                    
                    let payoutsHtml = '';
                    let worksHtml = '';
                    let dayPay = 0;
                    let workCount = 0;
                    
                    dayShifts.forEach(s => {
                        if (s.isPayout) {
                            payoutsHtml += `<div style="font-size:8px;line-height:1.1;margin-bottom:2px;background:#e0e7ff;padding:2px;border-radius:2px;color:#3730a3;font-weight:bold;text-align:center;border:1px solid #a5b4fc">
                                ${s.payoutType.toUpperCase()}<br><span style="color:#dc2626">${s.payoutAmount}₴</span>
                                ${isAdmin ? `<br><span style="color:#b91c1c;text-decoration:underline;cursor:pointer;display:block;margin-top:3px;font-size:7px" onclick="event.stopPropagation();if(confirm('Удалить выплату?')){delRec('Timesheet','${s.id}');setTimeout(()=>openWorkerCalendar('${esc(name)}',${year},${month}),500)}">УДАЛИТЬ</span>` : ''}
                            </div>`;
                            cellBg = '#f8fafc'; 
                        } else {
                            workCount++;
                            let rt = parseFloat(s.rate)||0;
                            dayPay += rt;
                            let isSub = (s.name !== name);
                            let subLabel = isSub ? `<b style="color:#d97706">(доп)</b>` : '';
                            let bHtml = (parseFloat(s.bonus)>0) ? `<span style="color:#d97706;font-size:7px;">+${s.bonus}</span>` : '';
                            worksHtml += `<div style="font-size:7px;line-height:1.1;margin-bottom:1px;border-bottom:1px dashed #a7f3d0;padding-bottom:1px;text-align:center;">
                                ${s.start}-${s.end} ${subLabel} ${bHtml}<br><span style="color:#dc2626;font-weight:bold">${rt}₴</span>
                                ${isAdmin ? `<span style="color:#b91c1c;text-decoration:underline;cursor:pointer;display:inline-block;margin-left:2px;" onclick="event.stopPropagation();if(confirm('Удалить смену?')){delRec('Timesheet','${s.id}');setTimeout(()=>openWorkerCalendar('${esc(name)}',${year},${month}),500)}">✕</span>` : ''}
                            </div>`;
                        }
                    });
                    
                    if (workCount > 0) {
                        // Если записей в дне больше 1, показываем итоговую сумму
                        let totalLabel = workCount > 1 ? `<div style="font-size:8px;font-weight:900;color:#0f172a;text-align:center;margin-top:1px;background:#a7f3d0;border-radius:2px;">Σ: ${parseFloat(dayPay.toFixed(2))}₴</div>` : '';
                        innerHtml += `<div style="background:#d1fae5;padding:1px;border-radius:2px;color:#047857;margin-bottom:2px;">
                            ${worksHtml}
                            ${totalLabel}
                        </div>`;
                    }
                    innerHtml += payoutsHtml;

                } else {
                    if (!isWeekend && !isFuture) {
                        if(!isToday) cellBg = '#eff6ff';
                        if(!isToday) cellBorder = '1px solid #93c5fd';
                        innerHtml += `<div style="font-size:18px;color:#2563eb;text-align:center;margin-top:4px;font-weight:900;">Н</div>`;
                    }
                }
                
                h += `<div style="background:${cellBg};border:${cellBorder};border-radius:4px;min-height:55px;display:flex;flex-direction:column;padding:1px;overflow:hidden">${innerHtml}</div>`;
            }
            
            h += `</div>`;
            
            let actionsHtml = `<div style="display:flex;gap:5px;margin-top:10px;">`;
            if (advanceAmt === 0 && earned1to15 > 0 && calcAdv > 0) {
                actionsHtml += `<button class="btn-main" style="flex:1;background:#3b82f6;font-size:10px;margin:0;" onclick="issuePayout('${esc(name)}', '${monthKey}', 'Аванс', ${calcAdv})">💸 АВАНС (~${calcAdv}₴)</button>`;
            }
            if (remZp > 0) {
                actionsHtml += `<button class="btn-main" style="flex:1;background:#10b981;font-size:10px;margin:0;" onclick="issuePayout('${esc(name)}', '${monthKey}', 'Зарплата', ${remZp})">💰 ЗАРПЛАТА (${remZp}₴)</button>`;
            }
            actionsHtml += `</div>`;

            h += `<div style="margin-top:10px;background:#f8fafc;border:1px solid #cbd5e1;padding:10px;border-radius:8px;text-align:center;font-weight:900;font-size:12px;">
                <div style="color:#475569;font-size:10px;margin-bottom:4px;text-transform:uppercase;">ФИНАНСЫ ЗА ПЕРИОД</div>
                <div style="display:flex;justify-content:space-between;border-bottom:1px dashed #cbd5e1;padding-bottom:2px;margin-bottom:2px;">
                    <span>Заработано (смен: ${totalShifts}):</span> <span style="color:#059669">${totalZp} ₴</span>
                </div>
                ${mRt > 0 ? `<div style="display:flex;justify-content:space-between;border-bottom:1px dashed #cbd5e1;padding-bottom:2px;margin-bottom:2px;">
                    <span>Ставка за месяц:</span> <span style="color:#059669">${mRt} ₴</span>
                </div>` : ''}
                <div style="display:flex;justify-content:space-between;border-bottom:1px dashed #cbd5e1;padding-bottom:2px;margin-bottom:2px;">
                    <span>Выдан аванс:</span> <span style="color:#2563eb">${advanceAmt + salaryAmt} ₴</span>
                </div>
                <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:14px;">
                    <span>Остаток к выплате:</span> <span style="color:#dc2626">${remZp} ₴</span>
                </div>
            </div>`;
            h += actionsHtml;
            
            gID('mT').innerText = 'ТАБЕЛЬ: ' + name;
            gID('mB').innerHTML = h;
            gID('mdl').querySelector('.modal-box').style.maxWidth = '450px';
            gID('mdl').style.display = 'flex';
        };

        window.issuePayout = async function(name, monthKey, type, defaultAmt) {
            let amtStr = prompt(`Введите сумму выплаты (${type}) для ${name}:`, defaultAmt);
            if (!amtStr) return;
            let amt = parseInt(amtStr.replace(/\\D/g, ''));
            if (isNaN(amt) || amt <= 0) return alert('Некорректная сумма');
            
            let payoutDate = prompt(`Введите дату выплаты (ГГГГ-ММ-ДД):\\n(В эту дату запись появится в календаре)`, getLocalDateStr());
            if (!payoutDate) return;

            showLoad();
            try {
                await db.child('Timesheet').push({
                    date: payoutDate,
                    name: name,
                    isPayout: true,
                    payoutType: type,
                    payoutAmount: amt,
                    forMonth: monthKey,
                    ts: new Date().toISOString()
                });
                hideLoad();
                alert(`Выплата (${type}) сохранена!`);
                let [y, m] = monthKey.split('-').map(Number);
                openWorkerCalendar(name, y, m - 1);
            } catch(e) {
                hideLoad();
                alert(e.message);
            }
        };

        window.openWorkersMgmt = function() {
            let h = `<div style="margin-bottom:15px;display:flex;flex-wrap:wrap;gap:5px;">
                <input type="text" id="newWorkerName" placeholder="Имя..." class="fas-inp" style="flex:1;min-width:100px;">
                <input type="number" id="newWorkerRate" placeholder="₴/час" class="fas-inp" style="flex:1;min-width:60px;">
                <input type="number" id="newWorkerDay" placeholder="₴/день" class="fas-inp" style="flex:1;min-width:60px;">
                <input type="number" id="newWorkerFas" placeholder="₴/шт(фас)" class="fas-inp" style="flex:1;min-width:60px;">
                <input type="number" id="newWorkerMonth" placeholder="₴/мес" class="fas-inp" style="flex:1;min-width:60px;">
                <button class="btn-main" style="width:100%;margin:0;" onclick="addWorker()">ДОБАВИТЬ</button>
            </div>
            <div id="workersList"></div>`;
            gID('mT').innerText = 'БАЗА СОТРУДНИКОВ';
            gID('mB').innerHTML = h;
            gID('mdl').querySelector('.modal-box').style.maxWidth = '400px';
            gID('mdl').style.display = 'flex';
            renderWorkersList();
        };

        window.renderWorkersList = function() {
            const wList = gID('workersList');
            if (!wList) return;
            const w = data.Workers || {};
            let h = '';
            Object.keys(w).sort((a,b) => (w[a].name||'').localeCompare(w[b].name||'')).forEach(k => {
                const rt = w[k].defRate || 0, dRt = w[k].dayRate || 0, fRt = w[k].fasRate || 0, mRt = w[k].monthRate || 0;
                let inf = [];
                if(rt) inf.push(`${rt}₴/ч`); if(dRt) inf.push(`${dRt}₴/д`); if(fRt) inf.push(`${fRt}₴/шт`); if(mRt) inf.push(`${mRt}₴/мес`);
                h += `<div style="display:flex;justify-content:space-between;align-items:center;background:#f8fafc;padding:8px;border-radius:4px;border:1px solid #e2e8f0;margin-bottom:4px;">
                    <div style="font-weight:900;font-size:14px;">${esc(w[k].name)} <div style="color:#059669;font-size:9px">${inf.join(' | ')}</div></div>
                    <div style="display:flex;gap:5px;">
                        <button style="background:#eef2ff;color:var(--p);border:1px solid var(--p);padding:5px 10px;border-radius:4px;font-weight:bold;font-size:10px;" onclick="editWorkerRates('${k}', '${rt}', '${dRt}', '${fRt}', '${mRt}')">ТАРИФЫ</button>
                        <button style="background:#fee2e2;color:#dc2626;border:none;padding:5px 10px;border-radius:4px;font-weight:bold;font-size:10px;" onclick="delWorker('${k}')">УДАЛИТЬ</button>
                    </div>
                </div>`;
            });
            wList.innerHTML = h || '<div style="text-align:center;padding:10px;color:#64748b;font-size:12px;">Список пуст</div>';
        };

        window.addWorker = async function() {
            const n = gID('newWorkerName').value.trim();
            const r = parseFloat(gID('newWorkerRate').value) || 0;
            const dr = parseFloat(gID('newWorkerDay').value) || 0;
            const fr = parseFloat(gID('newWorkerFas').value) || 0;
            const mr = parseFloat(gID('newWorkerMonth').value) || 0;
            if(!n) return;
            showLoad();
            try {
                await db.child('Workers').push({ name: n, defRate: r, dayRate: dr, fasRate: fr, monthRate: mr });
                openWorkersMgmt(); 
                hideLoad();
            } catch(e) { hideLoad(); alert(e); }
        };

        window.editWorkerRates = async function(id, rt, drt, frt, mrt) {
            const nrt = prompt('Часовая ставка (₴/час):', rt) || 0; if(nrt===null) return;
            const ndrt = prompt('Дневная ставка (₴/день):', drt) || 0; if(ndrt===null) return;
            const nfrt = prompt('Сдельная за фасовку (₴/шт):', frt) || 0; if(nfrt===null) return;
            const nmrt = prompt('Фиксированная ставка за месяц (₴/мес):', mrt) || 0; if(nmrt===null) return;
            showLoad();
            try {
                await db.child('Workers/' + id).update({ 
                    defRate: parseFloat(String(nrt).replace(',', '.')) || 0,
                    dayRate: parseFloat(String(ndrt).replace(',', '.')) || 0,
                    fasRate: parseFloat(String(nfrt).replace(',', '.')) || 0,
                    monthRate: parseFloat(String(nmrt).replace(',', '.')) || 0
                });
                hideLoad();
                renderWorkersList();
            } catch(e) { hideLoad(); alert(e); }
        };

        window.delWorker = async function(id) {
            if(!confirm('Точно удалить сотрудника из базы?')) return;
            showLoad();
            try {
                await db.child('Workers/' + id).remove();
                hideLoad();
            } catch(e) { hideLoad(); alert(e); }
        };

        window.openAddPrice=function(){aId=null;gID('mdl').style.display='flex';gID('mT').innerText='ДОБАВИТЬ В ПРАЙС';gID('mB').innerHTML=`<div>ТОВАР <input type="text" id="prN"></div><div>ДЛЯ ПЕЧАТИ (накладная) <input type="text" id="prP" placeholder="Необязательно"></div><div>ЦЕНА ОПТ <input type="number" id="prO"></div><div>ЦЕНА РОЗНИЦА <input type="number" id="prR"></div><div>ЦЕНА Б/Н <input type="number" id="prB"></div><button class="btn-main" onclick="sPrice()">СОХРАНИТЬ</button>`};
        window.editPrice=function(id,n,p,o,r,b){aId=id;gID('mdl').style.display='flex';gID('mT').innerText='РЕДАКТИРОВАТЬ';const sN=esc(n),sP=esc(p||'');gID('mB').innerHTML=`<div>ТОВАР <input type="text" id="prN" value="${sN}"></div><div>ДЛЯ ПЕЧАТИ (накладная) <input type="text" id="prP" value="${sP}"></div><div>ЦЕНА ОПТ <input type="number" id="prO" value="${o}"></div><div>ЦЕНА РОЗНИЦА <input type="number" id="prR" value="${r}"></div><div>ЦЕНА Б/Н <input type="number" id="prB" value="${b}"></div><button class="btn-main" onclick="sPrice()">СОХРАНИТЬ</button>`};

            const spokenWords = spokenText.toLowerCase().split(' ').filter(w => w.length > 0);
            
            Array.from(select.options).forEach(opt => {
                if (opt.value === "" || opt.value === "NEW") return;
                const optText = opt.text.toLowerCase();
                let score = 0;
                if (optText.includes(spokenText.toLowerCase())) score += 100;
                
                let matchedWords = 0;
                spokenWords.forEach(w => {
                    if (w.length > 2 && optText.includes(w)) matchedWords++;
                });
                if (matchedWords > 0) {
                    score += matchedWords * 10;
                    if (matchedWords === spokenWords.length) score += 50;
                }
                if (score > maxScore) {
                    maxScore = score;
                    bestMatch = opt;
                }
            });
            return bestMatch;
        }

                            showError("❌ БЕЗ ЦИФРЫ: " + processedSpeech, "Нет цифры");
                            return; 
                        }
                    }
        
                    const cleanSpokenName = spokenName.replace(/\s+/g, ' ').trim();
                    const spokenWords = cleanSpokenName.split(' ').filter(w => w.length > 0);
                    
                    let bestMatch = null;
                    let maxScore = 0;
                    
                    document.querySelectorAll('.bulk-q').forEach(input => {
                        const itemName = input.dataset.n.toLowerCase();
                        let score = 0;
                        if (itemName.includes(cleanSpokenName)) score += 100;
                        let matchedWords = 0;
                        spokenWords.forEach(w => {
                            if (w.length <= 2) {
                                if (new RegExp('\\b' + w + '\\b').test(itemName)) matchedWords += 2;
                            } else if (itemName.includes(w)) {
                                matchedWords++;
                            }
                        });
                        if (matchedWords > 0) {
                            score += matchedWords * 10;
                            if (matchedWords >= spokenWords.length) score += 50;
                        }
                        if (score > maxScore && score > 0) {
                            maxScore = score;
                            bestMatch = input;
                        }
                    });
        
                    if (bestMatch) {
                        let sName = bestMatch.dataset.n.replace(/\s*1\/0\.\d+/g, "").trim();
                        sName = sName.replace(/\b1\b/g, "первая").replace(/\b2\b/g, "вторая");
                        
                        if (isDelete) {
                            bestMatch.value = '';
                            bestMatch.parentElement.classList.remove('tile-filled');
                            window.speakOut(sName + " удалено");
                        } else {
                            bestMatch.value = (parseFloat(bestMatch.value) || 0) + qty;
                            bestMatch.parentElement.classList.add('tile-filled');
                            window.speakOut(sName + " " + qty + " добавлено");
                        }
                        window.updShipTotal();
                        
                        if (!vBlockBtnUpdate) {
                            btn.style.background = "#dcfce3";
                            setTimeout(() => { if (vIsRec && !vBlockBtnUpdate) btn.style.background = "#fee2e2"; }, 500);
                        }
                    } else {
                        alert("Товар не найден. Услышала: " + cleanSpokenName); showError("❌ ИСКАЛ: " + processedSpeech, "Товар не найден");
                    }
                }
            };
        
            vRec.onend = function() {
                if (!vForceStop) {
                    try { vRec.start(); } catch(e) {}
                } else {
                    vIsRec = false;
                    if (!vBlockBtnUpdate) {
                        btn.innerText = "🎤 ГОЛОС";
                        btn.style.background = "#eef2ff";
                    }
                }
            };
        
            vRec.onerror = function(event) {
                if (event.error === 'no-speech') return; 
                vForceStop = true;
                vIsRec = false;
                btn.innerText = "🎤 ГОЛОС";
                btn.style.background = "#eef2ff";
                if (event.error === 'not-allowed') {
                    alert("Нет доступа к микрофону. Проверьте разрешения браузера.");
                } else {
                    console.error("Mic error:", event.error);
                }
            };
        
            try {
                vRec.start();
            } catch(err) {
                alert("Ошибка запуска: " + err.message);
            }
        };
        window.testClientVoice = function() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return alert("Ваш браузер не поддерживает голосовой ввод");

    const btn = document.getElementById('vTestBtn');
    let rec = new SpeechRecognition();

    rec.continuous = false;
    rec.interimResults = false;
    
    rec.onstart = function() {
        btn.innerText = "🔴 СЛУШАЮ...";
        btn.style.background = "#fca5a5";
    };
    rec.onresult = function(event) {
        let speechResult = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
        let processedSpeech = speechResult;
        
        const wordsToNum = { 'ноль':0, 'нуль':0, 'один':1,'одна':1,'два':2,'две':2,'три':3,'четыре':4,'пять':5,'шесть':6,'семь':7,'восемь':8,'девять':9,'десять':10, 'одиннадцать':11, 'двенадцать':12, 'тринадцать':13, 'четырнадцать':14, 'пятнадцать':15, 'шестнадцать':16, 'семнадцать':17, 'восемнадцать':18, 'девятнадцать':19, 'двадцать':20, 'тридцать':30, 'сорок':40, 'пятьдесят':50, 'шестьдесят':60, 'семьдесят':70, 'восемьдесят':80, 'девяносто':90, 'сто':100 };
        Object.keys(wordsToNum).forEach(w => { processedSpeech = processedSpeech.replace(new RegExp('\\b' + w + '\\b', 'g'), wordsToNum[w]); });
        
        if(typeof voiceSynonyms !== 'undefined') {
            Object.keys(voiceSynonyms).forEach(w => {
                processedSpeech = processedSpeech.split(w).join(voiceSynonyms[w].toLowerCase());
            });
        }

        let bestMatch = findBestOption('s_hC', processedSpeech);
        
        alert("🎤 Услышала:\n" + speechResult + "\n\n⚙️ После словаря:\n" + processedSpeech + "\n\n✅ Итоговый клиент:\n" + (bestMatch ? bestMatch.text : "❌ НЕ НАЙДЕН"));
    };

    rec.onend = function() {
        btn.innerText = "ТЕСТ КЛ.";
        btn.style.background = "#fef08a";
    };
    
    rec.onerror = function(event) {
        btn.innerText = "ТЕСТ КЛ.";
        btn.style.background = "#fef08a";
        if (event.error !== 'no-speech') alert("Ошибка микрофона: " + event.error);
    };

    try { rec.start(); } catch(err) { alert(err.message); }
};
window.restoreDB = function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            const newDbData = JSON.parse(e.target.result);
            
            if (prompt('ВНИМАНИЕ! Это полностью удалит текущую базу и заменит её на данные из резервной копии.\n\nВведите слово ВОССТАНОВИТЬ для подтверждения:') !== 'ВОССТАНОВИТЬ') {
                event.target.value = ''; 
                return alert('Восстановление отменено.');
            }

            showLoad();
            await db.set(newDbData);
            hideLoad();
            
            alert('База данных успешно восстановлена! Страница будет перезагружена.');

        } catch (err) {
            hideLoad();
            alert('Ошибка чтения файла или записи в базу: ' + err.message);
        }
        event.target.value = ''; 
    };
    reader.readAsText(file);

let wsChartInstance = null;

        let tr = 0;
        if (v.rawBase) tr += v.rawBase.w;

            let m = String(v.rawMix).match(/\d+(?:\.\d+)?/g);

window.getRegOutHTML = function(isPrint) {
    const dFrom = gID('regFrom').value;
    const dTo = gID('regTo').value;

    const fItem = gID('regItem').value;

    let allItems = [];
    
    Object.values(d).forEach(v => {
        const dt = (v.date || '').split('T')[0];
        if (dt >= dFrom && dt <= dTo) {
            if (fClient !== 'ALL' && v.client !== fClient) return;
            
            const dtObj = new Date(v.date);
            const dStr = dtObj.getDate().toString().padStart(2, '0') + '.' + (dtObj.getMonth() + 1).toString().padStart(2, '0') + '.' + dtObj.getFullYear();
            
            let invMatchItem = false;
            let tempItems = [];
            
            if (v.items) {
                v.items.forEach(it => {
                    const p = it.split('|');
                    const iName = p[0];
                    const printName = getPrintName(iName) || iName;
                    
                    if (fItem !== 'ALL' && iName !== fItem && printName !== fItem) return;
                    
                    invMatchItem = true;
                    tempItems.push({
                        date: dt,
                        dateStr: dStr,
                        invNum: v.num || '-',
                        client: v.client || 'Неизвестно',
                        name: printName,
                        qty: parseFloat(p[1]) || 0,
                        unit: p[2] || 'шт',
                        price: parseFloat(p[4]) || 0,
                        sum: parseFloat(p[5]) || 0
                    });
                });
            }
            
            if (fItem === 'ALL' || invMatchItem) {
                invoices.push(v);
                allItems.push(...tempItems);
            }
        }
    });

    if (!invoices.length && !allItems.length) { alert('Нет данных по этим фильтрам'); return null; }

    let textColor = isPrint ? '#000' : 'inherit';
    let h = `<div style="font-family: sans-serif; color: ${textColor}; font-size: 10px;">`;

                    <div style="padding-left: 5px; overflow: hidden; text-overflow: ellipsis;">${cli}</div>
                  </div>`;
        });
        h += `</div>`;
    } else {
        const groups = {};
        let totalSum = 0;

        allItems.forEach(item => {
            let key = '';
            if (type === 'byClient') key = item.client;
            else if (type === 'byItem') key = item.name;
            else if (type === 'byDate') key = item.dateStr;

            if (!groups[key]) groups[key] = [];

            invKeysOrder.sort((a, b) => invoicesInGroup[b].rawDate.localeCompare(invoicesInGroup[a].rawDate));

            invKeysOrder.forEach(ik => {

                let showSeparator = (invData.items.length > 1 && type !== 'byItem');
                
                if (showSeparator) {
                    h += `<tr style="background: ${isPrint ? '#f1f5f9' : 'rgba(241,245,249,0.2)'}; border-top: 1px solid #94a3b8; border-bottom: 1px solid #94a3b8;">

                          </tr>`;

                    grpQty += it.qty;
                    grpSum += it.sum;
                    let col1 = type === 'byDate' ? it.client : it.dateStr;
                    let col2 = type === 'byItem' ? it.client : it.name;
                    
                    let btmBorder = (!showSeparator && idx === invData.items.length - 1) ? `1px solid ${borderColor}` : '1px dashed #ccc';
                    
                    h += `<tr style="border-bottom: ${btmBorder};">
                            <td style="padding: 2px; border-left: 1px solid ${borderColor}; vertical-align: top;">${esc(col1)}</td>
                            <td style="padding: 2px; vertical-align: top;">${esc(col2)}</td>
                            <td style="padding: 2px; text-align: center; vertical-align: top;">${esc(it.invNum)}</td>
                            <td style="padding: 2px; text-align: right; font-weight: bold; vertical-align: top;">${it.qty} <span style="font-size: 8px; font-weight: normal;">${it.unit}</span></td>
                            <td style="padding: 2px; text-align: right; vertical-align: top;">${it.price.toFixed(2)}</td>
                            <td style="padding: 2px; text-align: right; border-right: 1px solid ${borderColor}; vertical-align: top;">${it.sum.toFixed(2)}</td>
                          </tr>`;
                });
                
                if (showSeparator) {
                    h += `<tr>
                            <td colspan="5" style="padding: 2px; text-align: right; font-style: italic; color: #475569; border-left: 1px solid ${borderColor}; border-bottom: 1px solid ${borderColor};">Итого по накл. № ${esc(invData.inv)}:</td>
                            <td style="padding: 2px; text-align: right; font-weight: bold; color: #475569; border-right: 1px solid ${borderColor}; border-bottom: 1px solid ${borderColor};">${invData.sum.toFixed(2)}</td>
                          </tr>`;
                }
            });
            
            let totalQtyStr = type === 'byItem' ? `${grpQty} <span style="font-size: 8px; font-weight: normal;">${itemsInGroup[0].unit}</span>` : '-';
            
            h += `<tr style="font-weight: bold; border-top: 2px solid ${borderColor}; border-bottom: 2px solid ${borderColor};">
                    <td colspan="3" style="text-align: right; padding: 2px; border-left: 1px solid ${borderColor};">ИТОГО ПО ${type === 'byClient' ? 'КЛИЕНТУ' : (type === 'byItem' ? 'ПОЗИЦИИ' : 'ДНЮ')}:</td>
                    <td style="text-align: right; padding: 2px;">${totalQtyStr}</td>
                    <td style="text-align: right; padding: 2px;"></td>
                    <td style="text-align: right; padding: 2px; border-right: 1px solid ${borderColor};">${grpSum.toFixed(2)}</td>
                  </tr><tr><td colspan="6" style="height: 10px; border: none;"></td></tr>`;
        });
        
        h += `</table></div>`;
        h += `<div style="text-align: right; font-weight: 900; font-size: 14px; margin-top: 10px;">ОБЩАЯ СУММА ЗА ПЕРИОД: ${totalSum.toFixed(2)} грн</div>`;
    }
    
    h += `</div>`;
    return h;
};

window.printRegOut = function() {
    const h = getRegOutHTML(true);
    if (!h) return;
    gID('print-view').innerHTML = h;
    window.print();
    setTimeout(() => {
        gID('print-view').innerHTML = '';
        closeModal();
    }, 800);
};

window.viewRegOut = function() {
    const h = getRegOutHTML(false);
    if (!h) return;
    gID('mT').innerText = 'ПРОСМОТР РЕЕСТРА';
    gID('mB').innerHTML = h + `<button class="btn-main" onclick="openModal('regOut')" style="margin-top:15px;background:#64748b;">⬅ НАЗАД К ФИЛЬТРАМ</button>`;
};
window.openMassAdvance = function() {
    const dObj = new Date();
    let y = dObj.getFullYear();
    let m = dObj.getMonth();
    
    let targetDate = 15;
    let checkD = new Date(y, m, targetDate);
    if (checkD.getDay() === 6) targetDate = 14;
    if (checkD.getDay() === 0) targetDate = 13;
    
    const monthStr = String(m + 1).padStart(2, '0');
    const maxDateStr = `${y}-${monthStr}-${String(targetDate).padStart(2, '0')}`;
    const minDateStr = `${y}-${monthStr}-01`;
    const monthKey = `${y}-${monthStr}`;

    const ts = data.Timesheet || {};
    let earnings = {};
    const getBase = n => n ? n.replace(/\s*\d+$/, '').trim() : '';
    
    Object.values(ts).forEach(v => {
        if (v.name && !v.isPayout && v.date >= minDateStr && v.date <= maxDateStr) {
            let b = getBase(v.name);
            earnings[b] = (earnings[b] || 0) + (parseFloat(v.rate) || 0);
        }
    });
    
    let rowsHtml = '';
    let totalAdv = 0;
    
    Object.keys(earnings).sort().forEach(name => {
        let earned = earnings[name];
        let adv = Math.round((earned * 0.8) / 1000) * 1000;
        if (adv > 0) {
            rowsHtml += `<div class="fas-row-out" style="grid-template-columns: 2fr 100px 40px; margin-bottom:5px; align-items:center;" id="mAdvRow_${name.replace(/\s/g, '_')}">
                <div style="font-weight:900; font-size:13px; color:#0f172a">${esc(name)}</div>
                <input type="number" class="fas-inp adv-inp" data-name="${esc(name)}" value="${adv}" oninput="calcMassAdvTotal()" style="font-weight:bold;text-align:center;font-size:14px;">
                <button onclick="this.parentElement.remove(); calcMassAdvTotal();" style="background:red;color:white;border:none;border-radius:6px;height:32px;font-weight:900">✕</button>
            </div>`;
            totalAdv += adv;
        }
    });
    
    if (!rowsHtml) rowsHtml = '<div style="text-align:center;padding:10px;font-weight:bold;color:#64748b;">Нет данных для расчета (с 1 числа)</div>';
    
    let h = `<div style="margin-bottom:15px; font-size:11px; color:#64748b; background:#f1f5f9; padding:8px; border-radius:6px; border:1px solid #cbd5e1;">
        <b>Период:</b> 01.${monthStr}.${y} — ${String(targetDate).padStart(2,'0')}.${monthStr}.${y}<br>
        <b>Алгоритм:</b> 80% от заработанного, округление до тысяч.
    </div>
    <div id="mAdvRows" style="max-height:50vh; overflow-y:auto; margin-bottom:10px; padding-right:5px;">${rowsHtml}</div>
    <div style="font-weight:900; font-size:16px; text-align:right; margin-bottom:15px; border-top:2px solid #e2e8f0; padding-top:10px;">
        ОБЩАЯ СУММА: <span id="mAdvTotal" style="color:#dc2626">${totalAdv}</span> грн
    </div>
    <button class="btn-main" style="background:#10b981;" onclick="saveMassAdvance('${monthKey}')">ВЫДАТЬ АВАНС ВСЕМ</button>`;
    
    gID('mT').innerText = 'МАССОВЫЙ АВАНС';
    gID('mB').innerHTML = h;
    gID('mdl').querySelector('.modal-box').style.maxWidth = '400px';
    gID('mdl').style.display = 'flex';
};

window.calcMassAdvTotal = function() {
    let total = 0;
    document.querySelectorAll('#mAdvRows .adv-inp').forEach(inp => {
        total += parseFloat(inp.value) || 0;
    });
    let el = document.getElementById('mAdvTotal');
    if (el) el.innerText = total;
};

window.saveMassAdvance = async function(monthKey) {
    const inputs = document.querySelectorAll('#mAdvRows .adv-inp');
    if (inputs.length === 0) return alert('Список пуст');
    
    let dObj = new Date();
    let d = String(dObj.getDate()).padStart(2, '0');
    let m = String(dObj.getMonth() + 1).padStart(2, '0');
    let y = dObj.getFullYear();
    let payoutDate = `${y}-${m}-${d}`;
    let displayDate = `${d}.${m}.${y}`; 
    
    if (!confirm('Записать авансы в табель датой: ' + displayDate + '?')) return;
    
    showLoad();
    try {
        const u = {};
        const tsStr = new Date().toISOString();
        
        inputs.forEach(inp => {
            let amt = parseFloat(inp.value) || 0;
            let name = inp.dataset.name;
            if (amt > 0 && name) {
                let k = db.child('Timesheet').push().key;
                u['/Timesheet/' + k] = {
                    date: payoutDate,
                    name: name,
                    isPayout: true,
                    payoutType: 'Аванс',
                    payoutAmount: amt,
                    forMonth: monthKey,
                    ts: tsStr,
                    note: 'Массовый аванс'
                };
            }
        });
        
        if (Object.keys(u).length > 0) {
            await db.update(u);
            hideLoad();
            closeModal();
            alert('Авансы успешно записаны!');
            if (typeof renderTsList === 'function' && gID('cnt')) renderTsList(gID('cnt'));
        } else {
            hideLoad();
            alert('Нет сумм для сохранения');
        }
    } catch (e) {
        hideLoad();
        alert(e.message);
    }
};
</script>
